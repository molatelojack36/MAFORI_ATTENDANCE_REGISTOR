<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mafori FC Reports</title>

    <link rel="stylesheet" href="reports.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- ================================
         SIDEBAR
    ================================= -->

    <div class="sidebar">

        <h2>⚽ MAFORI FC</h2>

        <ul>

            <li onclick="location.href='dashboard.html'">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </li>

            <li onclick="location.href='players.html'">
                <i class="fa-solid fa-users"></i>
                Players
            </li>

            <li onclick="location.href='attendance.html'">
                <i class="fa-solid fa-calendar-check"></i>
                Attendance
            </li>

            <li class="active">
                <i class="fa-solid fa-chart-column"></i>
                Reports
            </li>

            <li onclick="location.href='downloads.html'">
                <i class="fa-solid fa-download"></i>
                Downloads
            </li>

            <li onclick="location.href='login.html'">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </li>

        </ul>

    </div>


    <!-- ================================
         MAIN CONTENT
    ================================= -->

    <div class="main">

        <header>

            <div>

                <h1>Attendance Reports</h1>

                <p>
                    Generate monthly attendance reports.
                </p>

            </div>

        </header>


        <!-- ================================
             FILTERS
        ================================= -->

        <div class="filter-box">

            <div class="filter-group">

                <label for="month">
                    Month
                </label>

                <select id="month">

                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>

                </select>

            </div>


            <div class="filter-group">

                <label for="year">
                    Year
                </label>

                <input
                    type="number"
                    id="year"
                    value="2026"
                    min="2000"
                    max="2100">

            </div>


            <button id="generateReport">

                <i class="fa-solid fa-chart-line"></i>

                Generate Report

            </button>

        </div>


        <!-- ================================
             STATISTICS
        ================================= -->

        <div class="stats">

            <div class="stat-card">

                <h3>Total Players</h3>

                <h2 id="totalPlayers">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <h3>Present</h3>

                <h2 id="presentPlayers">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <h3>Absent</h3>

                <h2 id="absentPlayers">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <h3>Excused</h3>

                <h2 id="excusedPlayers">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <h3>Attendance Rate</h3>

                <h2 id="attendanceRate">
                    0%
                </h2>

            </div>

        </div>


        <!-- ================================
             ATTENDANCE REPORT TABLE
        ================================= -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Player</th>

                        <th>Position</th>

                        <th>Status</th>

                        <th>Training Date</th>

                    </tr>

                </thead>


                <tbody id="reportTable">

                    <!-- JavaScript will insert report data here -->

                </tbody>

            </table>

        </div>


        <!-- ================================
             DOWNLOAD BUTTONS
        ================================= -->

        <div class="buttons">

            <button id="downloadPDF">

                <i class="fa-solid fa-file-pdf"></i>

                Download PDF

            </button>


            <button id="downloadExcel">

                <i class="fa-solid fa-file-csv"></i>

                Download CSV

            </button>

        </div>

    </div>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script src="reports.js"></script>

</body>

</html>
