<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Remove Player - Mafori FC</title>

    <link rel="stylesheet" href="remove-player.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
    ></script>

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>⚽ MAFORI FC</h2>

        <ul>

            <li onclick="location.href='dashboard.html'">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </li>

            <li onclick="location.href='players.html'">
                <i class="fa-solid fa-users"></i>
                Players
            </li>

            <li onclick="location.href='attendance.html'">
                <i class="fa-solid fa-calendar-check"></i>
                Attendance
            </li>

            <li onclick="location.href='reports.html'">
                <i class="fa-solid fa-chart-column"></i>
                Reports
            </li>

            <li onclick="location.href='downloads.html'">
                <i class="fa-solid fa-download"></i>
                Download
            </li>

            <li onclick="location.href='settings.html'">
                <i class="fa-solid fa-gear"></i>
                Settings
            </li>

            <li onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </li>

        </ul>

    </div>


    <!-- MAIN CONTENT -->

    <div class="main">

        <header>

            <div>

                <h1>Remove Player</h1>

                <p>
                    Remove a player from the Mafori FC database.
                </p>

            </div>

            <button
                class="back-button"
                onclick="location.href='players.html'"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back to Players

            </button>

        </header>


        <!-- SEARCH -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchPlayer"
                placeholder="Search player by name, position or ID..."
            >

        </div>


        <!-- PLAYER TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Player ID</th>

                        <th>Player Name</th>

                        <th>Nickname</th>

                        <th>Position</th>

                        <th>Date of Birth</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="playerTable">

                </tbody>

            </table>

        </div>

    </div>


    <script src="remove-player.js"></script>

</body>

</html>
