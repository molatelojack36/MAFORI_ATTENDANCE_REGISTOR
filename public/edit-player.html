<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Edit Player | Mafori FC
    </title>


    <!-- GOOGLE FONT -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- EDIT PLAYER CSS -->

    <link
        rel="stylesheet"
        href="edit-player.css"
    >

</head>


<body>


    <!-- ==========================================
         MAIN CONTAINER
    =========================================== -->

    <div class="container">


        <!-- ======================================
             EDIT PLAYER CARD
        ======================================= -->

        <div class="card">


            <!-- ==================================
                 TOP ACTION BUTTONS
            =================================== -->

            <div class="back-button-container">


                <!-- BACK TO PLAYERS -->

                <button
                    type="button"
                    class="back-button"
                    onclick="location.href='players.html'"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Players

                </button>


                <!-- LOGOUT -->

                <button
                    type="button"
                    class="logout-button"
                    onclick="logout()"
                >

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </button>

            </div>



            <!-- ==================================
                 PAGE TITLE
            =================================== -->

            <div class="page-heading">

                <div class="heading-icon">

                    <i class="fa-solid fa-user-pen"></i>

                </div>


                <div>

                    <h1>
                        Edit Player
                    </h1>

                    <p>
                        Update player information and save the changes.
                    </p>

                </div>

            </div>



            <!-- ==================================
                 EDIT PLAYER FORM
            =================================== -->

            <form id="editPlayerForm">


                <!-- FIRST NAME -->

                <div class="input-group">

                    <label for="first_name">

                        <i class="fa-solid fa-user"></i>

                        First Name

                    </label>

                    <input
                        type="text"
                        id="first_name"
                        placeholder="Enter first name"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- LAST NAME -->

                <div class="input-group">

                    <label for="last_name">

                        <i class="fa-solid fa-user"></i>

                        Last Name

                    </label>

                    <input
                        type="text"
                        id="last_name"
                        placeholder="Enter last name"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- NICKNAME -->

                <div class="input-group">

                    <label for="nickname">

                        <i class="fa-solid fa-tag"></i>

                        Nickname

                    </label>

                    <input
                        type="text"
                        id="nickname"
                        placeholder="Enter nickname"
                        autocomplete="off"
                    >

                </div>


                <!-- POSITION -->

                <div class="input-group">

                    <label for="position">

                        <i class="fa-solid fa-shirt"></i>

                        Position

                    </label>

                    <select
                        id="position"
                        required
                    >

                        <option value="Goalkeeper">
                            Goalkeeper
                        </option>

                        <option value="Defender">
                            Defender
                        </option>

                        <option value="Midfielder">
                            Midfielder
                        </option>

                        <option value="Forward">
                            Forward
                        </option>

                    </select>

                </div>


                <!-- DATE OF BIRTH -->

                <div class="input-group">

                    <label for="date_of_birth">

                        <i class="fa-solid fa-cake-candles"></i>

                        Date of Birth

                    </label>

                    <input
                        type="date"
                        id="date_of_birth"
                    >

                </div>


                <!-- STATUS -->

                <div class="input-group">

                    <label for="status">

                        <i class="fa-solid fa-circle-check"></i>

                        Status

                    </label>

                    <select id="status">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>



                <!-- ==================================
                     UPDATE BUTTON
                =================================== -->

                <button
                    type="submit"
                    class="update-player-button"
                >

                    <i class="fa-solid fa-user-pen"></i>

                    Update Player

                </button>


            </form>


        </div>

    </div>



    <!-- ==========================================
         SWEETALERT
    =========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
    ></script>


    <!-- ==========================================
         EDIT PLAYER JS
    =========================================== -->

    <script src="edit-player.js"></script>


</body>

</html>
