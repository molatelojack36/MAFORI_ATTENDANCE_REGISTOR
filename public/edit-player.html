<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Player | Mafori FC</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="edit-player.css">

</head>


<body>


    <div class="container">

        <div class="card">


            <!-- =====================================
                 BACK TO PLAYERS
            ====================================== -->

            <div class="back-button-container">

                <button
                    type="button"
                    class="back-button"
                    onclick="location.href='players.html'">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Players

                </button>

            </div>


            <!-- =====================================
                 PAGE TITLE
            ====================================== -->

            <h1>
                Edit Player
            </h1>

            <p>
                Update player information.
            </p>


            <!-- =====================================
                 EDIT PLAYER FORM
            ====================================== -->

            <form id="editPlayerForm">


                <!-- FIRST NAME -->

                <div class="input-group">

                    <label for="first_name">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        required>

                </div>


                <!-- LAST NAME -->

                <div class="input-group">

                    <label for="last_name">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        required>

                </div>


                <!-- NICKNAME -->

                <div class="input-group">

                    <label for="nickname">
                        Nickname
                    </label>

                    <input
                        type="text"
                        id="nickname">

                </div>


                <!-- POSITION -->

                <div class="input-group">

                    <label for="position">
                        Position
                    </label>

                    <select id="position">

                        <option value="Goalkeeper">
                            Goalkeeper
                        </option>

                        <option value="Defender">
                            Defender
                        </option>

                        <option value="Midfielder">
                            Midfielder
                        </option>

                        <option value="Forward">
                            Forward
                        </option>

                    </select>

                </div>


                <!-- DATE OF BIRTH -->

                <div class="input-group">

                    <label for="date_of_birth">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="date_of_birth">

                </div>


                <!-- STATUS -->

                <div class="input-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <!-- UPDATE BUTTON -->

                <button type="submit">

                    <i class="fa-solid fa-user-pen"></i>

                    Update Player

                </button>


            </form>


        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="edit-player.js"></script>


</body>

</html>
