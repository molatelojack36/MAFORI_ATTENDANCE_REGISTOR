<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>View Players | Mafori FC</title>


    <!-- =====================================
         VIEW PLAYERS CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="view-players.css"
    >


    <!-- =====================================
         FONT AWESOME
    ====================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================
         SWEETALERT2
    ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
    ></script>

</head>


<body>


<!-- =====================================
     SIDEBAR
===================================== -->

<div class="sidebar">


    <!-- LOGO -->

    <div class="logo">

        <i class="fa-solid fa-futbol"></i>

        <h2>
            MAFORI FC
        </h2>

    </div>


    <!-- NAVIGATION -->

    <ul>


        <!-- DASHBOARD -->

        <li>

            <a href="dashboard.html">

                <i class="fa-solid fa-house"></i>

                Dashboard

            </a>

        </li>


        <!-- PLAYERS -->

        <li class="active">

            <a href="players.html">

                <i class="fa-solid fa-users"></i>

                Players

            </a>

        </li>


        <!-- ATTENDANCE -->

        <li>

            <a href="attendance.html">

                <i class="fa-solid fa-calendar-check"></i>

                Attendance

            </a>

        </li>


        <!-- REPORTS -->

        <li>

            <a href="reports.html">

                <i class="fa-solid fa-chart-column"></i>

                Reports

            </a>

        </li>


        <!-- LOGOUT -->

        <li>

            <a
                href="#"
                onclick="logout(); return false;"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </li>


    </ul>


</div>



<!-- =====================================
     MAIN CONTENT
===================================== -->

<div class="main-content">


    <!-- =================================
         PAGE HEADER
    ================================== -->

    <div class="header">


        <div>

            <h1>
                Player Management
            </h1>

            <p>
                View, search, edit and remove Mafori FC players.
            </p>

        </div>


        <!-- ADD PLAYER -->

        <a
            href="add-player.html"
            class="add-btn"
        >

            <i class="fa-solid fa-plus"></i>

            Add Player

        </a>


    </div>



    <!-- =================================
         PLAYER TABLE CARD
    ================================== -->

    <div class="table-card">


        <!-- =================================
             SEARCH
        ================================== -->

        <div class="table-header">

            <input
                type="text"
                id="searchInput"
                placeholder="Search player..."
                autocomplete="off"
            >

        </div>



        <!-- =================================
             SCROLLABLE TABLE
        ================================== -->

        <div class="table-scroll">


            <table>


                <!-- TABLE HEAD -->

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            First Name
                        </th>

                        <th>
                            Last Name
                        </th>

                        <th>
                            Nickname
                        </th>

                        <th>
                            Position
                        </th>

                        <th>
                            Date of Birth
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <!-- TABLE BODY -->

                <tbody id="playersTable">


                    <!-- =================================
                         LOADING MESSAGE
                    ================================== -->

                    <tr>

                        <td
                            colspan="8"
                            class="no-data"
                        >

                            <i class="fa-solid fa-spinner fa-spin"></i>

                            Loading players...

                        </td>

                    </tr>


                </tbody>


            </table>


        </div>


    </div>


</div>



<!-- =====================================
     JAVASCRIPT
===================================== -->

<script src="view-players.js"></script>


</body>

</html>
