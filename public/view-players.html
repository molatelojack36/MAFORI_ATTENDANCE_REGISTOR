<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Players | Mafori FC</title>

    <link rel="stylesheet" href="view-players.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="sidebar">

    <div class="logo">
        <i class="fa-solid fa-futbol"></i>
        <h2>MAFORI FC</h2>
    </div>

    <ul>

        <li>
            <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>
        </li>

        <li class="active">
            <a href="players.html">
                <i class="fa-solid fa-users"></i>
                Players
            </a>
        </li>

        <li>
            <a href="attendance.html">
                <i class="fa-solid fa-calendar-check"></i>
                Attendance
            </a>
        </li>

        <li>
            <a href="reports.html">
                <i class="fa-solid fa-chart-column"></i>
                Reports
            </a>
        </li>

        <li>
            <a href="login.html">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>
        </li>

    </ul>

</div>


<div class="main-content">

    <div class="header">

        <div>

            <h1>Player Management</h1>

            <p>View, search, edit and remove Mafori FC players.</p>

        </div>

        <a href="add-player.html" class="add-btn">

            <i class="fa-solid fa-plus"></i>

            Add Player

        </a>

    </div>


    <div class="table-card">

        <div class="table-header">

            <input
                type="text"
                id="searchInput"
                placeholder="Search player...">

        </div>


        <table>

            <thead>

                <tr>

                    <th>#</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Nickname</th>
                    <th>Position</th>
                    <th>Date of Birth</th>
                    <th>Status</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="playersTable">

            </tbody>

        </table>

    </div>

</div>

<script src="view-players.js"></script>

</body>

</html>
